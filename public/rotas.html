<main class="main"><header class="topbar"><h1>Controle de Rotas</h1></header><section class="content"><section class="panel"><h2>Controle Geral de Internet</h2><p>Altera todos os clientes ativos da Colônia Antônio Aleixo.</p><button onclick="rota('AMAZONET')">🟢 Todos para Amazonet</button><button onclick="rota('STARLINK')">🔵 Todos para Starlink</button><div id="msg" style="margin-top:20px"></div></section></section></main></div>
<script src="auth-painel.js"></script><script src="mobile-responsive.js"></script><script>async function rota(r){if(!confirm('Aplicar '+r+' para todos os clientes?'))return;let x=await fetch('/api/mikrotik/rota-geral',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rota:r})});let j=await x.json();const msg=document.getElementById('msg');
if(j.erro){
 msg.style.color='#dc2626';
 msg.innerText='❌ Erro ao alterar rota: '+j.erro;
}else{
 msg.style.color='#16a34a';
 msg.innerText='✅ Rota geral alterada com sucesso! Todos os clientes foram direcionados para '+r+'.';
}}</script></body></html>
