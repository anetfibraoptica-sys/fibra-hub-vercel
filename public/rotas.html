<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Controle de Rotas - Fibra+ Hub</title><link rel="stylesheet" href="style.css"></head><body><main class="main"><header class="topbar"><h1>Controle de Rotas</h1></header><section class="content"><section class="panel"><h2>Controle Geral de Internet</h2><p>Altera todos os clientes ativos da Colônia Antônio Aleixo.</p><button onclick="rota('AMAZONET')">🟢 Todos para Amazonet</button><button onclick="rota('STARLINK')">🔵 Todos para Starlink</button><div id="msg" style="margin-top:20px"></div></section></section></main><script>async function rota(r){if(!confirm('Aplicar '+r+' para todos os clientes?'))return;let x=await fetch('/api/mikrotik/rota-geral',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rota:r})});let j=await x.json();document.getElementById('msg').innerText=j.mensagem||j.erro||JSON.stringify(j)}</script></body></html>
